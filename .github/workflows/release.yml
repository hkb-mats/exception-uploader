name: Release

# Tests every push and pull request. A tag like v1.1.0 also builds the installers, attests them and
# publishes them as a GitHub Release, so every download can be traced to the commit it came from.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  AVALONIA_TELEMETRY_OPTOUT: '1'
  PROJECT: src/Exception.Uploader

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet test tests/Exception.Uploader.Tests

  windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        shell: bash
        run: dotnet publish "$PROJECT" -c Release -r win-x64 -p:PublishSingleFile=true -p:Version=${GITHUB_REF_NAME#v} -o publish

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" | Select-Object -First 1
          }
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & $iscc.FullName "/DAppVersion=$version" "/DSourceExe=$PWD\publish\ExceptionUploader.exe" "/O$PWD\dist" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish and package
        env:
          RID: ${{ matrix.rid }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          dotnet publish "$PROJECT" -c Release -r "$RID" -p:PublishSingleFile=true -p:Version=$VERSION -o publish
          packaging/package-mac.sh publish "$VERSION" "dist/Exception-Uploader-$RID.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.rid }}
          path: dist/
          if-no-files-found: error

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attest the downloads
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"version\":\"${GITHUB_REF_NAME#v}\"}" > dist/uploader.json
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Exception Uploader $GITHUB_REF_NAME" \
            --notes "Built from ${GITHUB_SHA} by this repository's release workflow. Check a download with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}"
